# Gitleaks config — catches secrets BEFORE they reach the remote.
# Install gitleaks: `brew install gitleaks` (macOS) or see https://github.com/gitleaks/gitleaks
#
# This file is checked into the repo so every developer (and CI) uses the same rules.
# The pre-commit hook in .git/hooks/pre-commit auto-detects gitleaks and runs it.

title = "AmperTalent secret detection"

# ─── Allowlist ─────────────────────────────────────────────────────────────
# The demo mode generates these patterns at runtime; GitGuardian mistakes
# them for real secrets. Allowlist by regex + path so they don't trigger.

[allowlist]
description = "Allow demo-mode fixtures, package-lock hashes, test placeholders"
# Regexes (matched against the secret value, not the whole file)
regexes = [
  # Test-only placeholder strings (anywhere in the codebase)
  '''<TEST-ONLY-NOT-REAL>''',
  '''<[A-Z_]+>''',                    # generic placeholders like <YOUR_KEY>
  '''\$\{[^}]+\}''',                 # template literal expressions
  '''process\.env''',                 # env reads, not hardcoded values
]
# Paths (matched against file path)
paths = [
  # Generated runtime values we never want to flag
  '''demo-[a-z_]+-\d+(-[a-z0-9]{4})?@ampertalent-demo\.com''',
  # npm integrity hashes are high-entropy by design
  '''package-lock\.json$''',
  # Test files use intentional placeholders / generated values
  '''__tests__/.*\.test\.ts$''',
  # Config files
  '''\.gitignore$''',
  '''\.vercelignore$''',
  # Public docs
  '''README\.md$''',
  '''CHANGELOG\.md$''',
  # TypeScript declaration files
  '''\.d\.ts$''',
]

# ─── Custom rules ──────────────────────────────────────────────────────────
# Each rule is a regex that, when matched, raises a secret alert.
# `id` is required; `description` is shown in the alert; `secretGroup` controls
# which capture group is the secret value.

[[rules]]
id = "ampertalent-clerk-secret-key"
description = "Clerk secret key (server-side)"
regex = '''sk_(test|live)_[A-Za-z0-9]{20,}'''
tags = ["clerk", "secret", "api-key"]

[[rules]]
id = "ampertalent-clerk-publishable-key"
description = "Clerk publishable key (safe to ship but flag for review)"
regex = '''pk_(test|live)_[A-Za-z0-9]{20,}'''
tags = ["clerk", "public-key"]

[[rules]]
id = "ampertalent-stripe-secret-key"
description = "Stripe secret key"
regex = '''sk_(test|live)_[A-Za-z0-9]{20,}|rk_(test|live)_[A-Za-z0-9]{20,}'''
tags = ["stripe", "secret"]

[[rules]]
id = "ampertalent-stripe-publishable-key"
description = "Stripe publishable key (safe to ship but flag for review)"
regex = '''pk_(test|live)_[A-Za-z0-9]{20,}'''
tags = ["stripe", "public-key"]

[[rules]]
id = "ampertalent-paypal-client-secret"
description = "PayPal client secret"
regex = '''E[A-Za-z0-9_-]{60,}'''
tags = ["paypal", "secret"]

[[rules]]
id = "ampertalent-github-token"
description = "GitHub personal access token"
regex = '''ghp_[A-Za-z0-9]{36,}'''
tags = ["github", "token"]

[[rules]]
id = "ampertalent-aws-access-key"
description = "AWS access key"
regex = '''AKIA[0-9A-Z]{16,}'''
tags = ["aws", "secret"]

[[rules]]
id = "ampertalent-resend-api-key"
description = "Resend API key"
regex = '''re_[A-Za-z0-9]{20,}'''
tags = ["resend", "api-key"]

[[rules]]
id = "ampertalent-supabase-jwt"
description = "Supabase service-role JWT (anon key is safe to ship)"
regex = '''eyJhbGciOi[A-Za-z0-9_-]{50,}\.[A-Za-z0-9_-]{50,}\.[A-Za-z0-9_-]{30,}'''
tags = ["supabase", "jwt"]

[[rules]]
id = "ampertalent-jwt-in-source"
description = "Generic JWT (anywhere in source — likely a leaked session token)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["jwt", "session"]

[[rules]]
id = "ampertalent-hardcoded-password"
description = "Hardcoded password assignment (looks like 'password: \"...\"')"
regex = '''(?i)(?:password|passwd|pwd|secret|api[_-]?key|token)\s*[:=]\s*['"][^'"]{6,}['"]'''
tags = ["password", "hardcoded"]
