# GitHub Actions — secret scanning with gitleaks
#
# Runs on every push and PR. Catches secrets that slip past the local
# pre-commit hook (e.g. on systems where the hook wasn't installed).
#
# Fails the check if a secret is detected, so it never reaches main.

name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan every commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITHUB_TOKEN is provided automatically by the action
